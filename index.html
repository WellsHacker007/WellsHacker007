<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>Austin Clock | Market Countdown</title><style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:#171a22;--line:#292e39;--muted:#9aa3b2;--text:#f4f6fa;--blue:#3975ff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% -20%,#1b2b4c 0,transparent 55%),var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:grid;place-items:center;padding:20px}main{width:min(100%,540px);display:grid;gap:16px}.card{background:linear-gradient(145deg,#171a22,#11141b);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 12px 36px #0005}.kicker{font-size:11px;font-weight:800;letter-spacing:.15em;color:var(--muted)}.time{font-size:clamp(42px,12vw,64px);font-weight:800;letter-spacing:-.055em;line-height:1.15;margin:12px 0 5px;font-variant-numeric:tabular-nums}.sub{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:18px}.unit{background:#0c0f15;border:1px solid #252a35;border-radius:13px;padding:14px 5px;text-align:center}.num{font-size:clamp(25px,7vw,34px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}.label{font-size:10px;color:var(--muted);letter-spacing:.12em;margin-top:6px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:#cbd5e1;font-size:11px}.count{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}.note{font-size:12px;color:var(--muted);margin:14px 2px 0}@media(max-width:360px){body{padding:14px}.card{padding:17px}.grid{gap:6px}.unit{padding:12px 2px}}
</style></head><body><main><section class="card"><div class="kicker">AUSTIN, TEXAS · LIVE LOCAL TIME</div><div class="time" id="clock">--:--:--</div><div class="sub" id="date">Loading Austin time…</div></section><section class="card"><div class="row" style="margin-top:0"><div class="kicker">POLYMARKET COUNTDOWN</div><span class="pill">Tweet market</span></div><div class="grid"><div class="unit"><div class="num" id="days">0</div><div class="label">DAYS</div></div><div class="unit"><div class="num" id="hours">00</div><div class="label">HRS</div></div><div class="unit"><div class="num" id="minutes">00</div><div class="label">MIN</div></div><div class="unit"><div class="num" id="seconds">00</div><div class="label">SEC</div></div></div><div class="row"><span class="sub">Last reported tweet count</span><span class="count">217</span></div><p class="note" id="status">Deadline inferred from your screenshot: Nov 13, 2026 at 22:29:56 India time. Tweet count is a manual snapshot, not live Polymarket data.</p></section></main><script>
const deadline=new Date('2026-11-13T22:29:56+05:30').getTime(),$=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');function update(){const now=new Date();$('clock').textContent=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true}).format(now);$('date').textContent=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(now);const remaining=Math.max(0,deadline-Date.now()),t=Math.floor(remaining/1000);$('days').textContent=Math.floor(t/86400);$('hours').textContent=pad(Math.floor(t%86400/3600));$('minutes').textContent=pad(Math.floor(t%3600/60));$('seconds').textContent=pad(t%60);if(!remaining)$('status').textContent='Estimated countdown has ended. Check Polymarket for the official market resolution.'}update();setInterval(update,1000);
</script></body></html>
